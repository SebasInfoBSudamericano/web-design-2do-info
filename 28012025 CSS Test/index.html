<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <h1>Prueba de Bloque 3</h1>
    <p>Nombre del Estudiante: <span>Sebastian Munzon</span></p>
    <form>
        <fieldset>
            <legend>Formulario de Registro</legend>
            <label for="name">Nombre de Usuario:</label>
            <input type="text" name="name" id="name" placeholder="Minimo 7 caracteres" minlength="7" required>
            <br>
            <label for="password">Password:</label>
            <input type="text" name="password" id="password" placeholder="Minimo 7 caracteres" minlength="7" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Minimo 7 caracteres" minlength="7" required>
            <br>
            <label>Género:</label>
            <input type="radio" id="masculino" name="genero" value="m">
            <label for="masculino">Masculino</label>

            <input type="radio" id="femenino" name="genero" value="f">
            <label for="femenino">Femenino</label>
            <br><br>
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>

</html>
