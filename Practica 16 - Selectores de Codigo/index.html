<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores de Codigo</title>
    <style>
        h1 {
            color: red;
            text-align: center;
        }
        #lista {
            color: blueviolet;
        }
        .compra {
            color: blue;
        }
    </style>
</head>

<body>
    <h1>Selectores H1</h1>
    <ul>
        <li id="lista">Lista de Compras</li>
        <ul>
            <li class="compra">Frutas:</li>
            <ul>
                <li>Manzanas</li>
                <li>Peras</li>
                <li>Duraznos</li>
            </ul>
            <li class="compra">Verduras:</li>
            <ul>
                <li>Brocoli</li>
                <li>Coliflor</li>
                <li>Col Morada</li>
                <li>Lechuga</li>
            </ul>
            <li class="compra">Carnes:</li>
            <ul>
                <li>1/2 lb Res</li>
                <li>1 lb Pollo</li>
                <li>2 lb Corvina</li>
            </ul>
        </ul>
    </ul>
</body>

</html>
