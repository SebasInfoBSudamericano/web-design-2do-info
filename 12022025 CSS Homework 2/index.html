<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Pseudo-clases</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="shortcut icon" href="form_logo.ico" type="image/x-icon">
</head>

<body>
    <h1>Tarea</h1>
    <form>
        <fieldset>
            <legend>Pseudo-clases con formularios</legend>
            <input type="radio" id="opcion1" name="opcion" value="1">
            <label for="opcion1">Opción 1</label>

            <input type="radio" id="opcion2" name="opcion" value="2">
            <label for="opcion2">Opción 2</label>

            <input type="radio" id="opcion3" name="opcion" value="3">
            <label for="opcion3">Opción 3</label>
        </fieldset>
    </form>
</body>

</html>
